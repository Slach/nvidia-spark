# RecursiveSI/flint-nvfp4-gguf (23GB NVFP4) via vllm/vllm-openai:flint-arm64-cu130 (vllm PR #62938)
# Recursive Flint 39.8B MoE (2.5B active) for coding agents: 49 layers = 35 SWA (window 513)
# + 14 full-attention, 256 experts top-6 + shared expert, 262K ctx, Apache-2.0
# GB10/sm_121: stock vLLM fallback layers (Marlin W4A16 NVFP4 + FlashInfer attention) -
# the PR custom Triton/CuTe kernels are gated to SM100 (B200/GB200), TP=1 no EP
# vllm:flint tag = official flint-arm64-cu130 (PR commit db02bc9f) + pip gguf layer,
# see Dockerfile.vllm.spark flint target; serve by repo id - local .gguf paths also hit
# a speculators-probe bug (#63020), HF hub cache resolves the repo id offline
# config+tokenizer overrides point at the BF16 repo (GGUF repo ships no config.json/tokenizer)
# parsers glm47 per PR recipe; --exclude-tools-when-tool-choice-none is PR-only, not in the image
# benchmark DGX Spark 2026-10-22 (GB10 sm_121, Marlin W4A16 + FlashInfer XQA decode):
#   ~3560 t/s cold prefill, 45-60 t/s generation in claude-code (60.5 t/s wallclock warm),
#   KV cache 85GiB = 2.68M tokens, prefix caching works (72.7% hit on 2nd run)
# gotchas found the hard way: kv fp8 hits an assert in flint/model.py (bf16 only),
# VLLM_USE_V2_MODEL_RUNNER=0 (V1 runner) breaks weight loading, and qwen38-flash-next
# modelopt_patched.py volume mount overwrites MarlinNvFp4LinearKernel -> shape assert
model: RecursiveSI/flint-nvfp4-gguf
hf-config-path: RecursiveSI/flint
tokenizer: RecursiveSI/flint
max-model-len: 262144
max-num-seqs: 4
max-num-batched-tokens: 8192
gpu-memory-utilization: 0.90
# Flint model.py asserts kv_cache_dtype in (auto, bfloat16) - no fp8 KV support
enable-chunked-prefill: true
enable-auto-tool-choice: true
tool-call-parser: glm47
reasoning-parser: glm47
