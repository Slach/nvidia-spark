# Thinking Machines Inkling 2 Mini - NATIVE sglang server config
# (docker-compose.yaml sglang service, selected by SGLANG_CONFIG in .env, start: `docker compose up -d sglang`)
# Keys = sglang serve CLI flags (kebab-case), booleans as bare true.
# model-path here is informational: compose passes SGLANG_MODEL from .env on the argv
# (the `sglang serve` CLI pre-parser requires it there, --config is ignored for it).
# DSpark gamma is pinned to the checkpoint block size (7/8) - not tunable.
# benchmark GB10 2026-11-22: prefill 3005 t/s @59k (5.9x llama.cpp), decode 28.4 plain /
# 29.1 MTP @59k, 37.4 short ctx; RAM 105-117GB. llama.cpp comparison: llama.cpp.models.ini
model-path: Blackfrost-AI/Inkling-2-Mini-Derisked
context-length: 262144
speculative-algorithm: DSPARK
speculative-draft-model-path: Blackfrost-AI/Inkling-2-Mini-Derisked
# multimodal disabled by default in the inkling image - enable for vision:
# enable-multimodal: true
