services:
  # wait when resolve freeze + OOM https://github.com/antirez/ds4/issues/705
  ds4:
    image: ds4:spark-full
    build:
      context: .
      dockerfile: Dockerfile.ds4.spark
    volumes:
      - ${HOME}/src/github.com/antirez/ds4/gguf:/app/gguf
      - ${HOME}/src/github.com/antirez/ds4/server-kv:/app/server-kv      
    command: /app/ds4-server --cuda --host 0.0.0.0 --prefill-chunk 2048 --port 8200 --threads 20  --kv-disk-dir /app/server-kv --kv-disk-space-mb 8192  --dspark --model /app/gguf/DeepSeek-V4-Flash-Layers37-42Q4KExperts-OtherExpertLayersIQ2XXSGateUp-Q2KDown-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-fixed-0731.gguf --mtp /app/gguf/DeepSeek-V4-Flash-DSpark-support-0731.gguf
    networks:
      - spark-network
    ports:
      - "127.0.0.1:8200:8200"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8200/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  ds4-sparkinfer:
    # wait when merge https://github.com/0xSero/deepseek-v4-flash-0731-spark-sparkinfer/pull/2 
    # image: ghcr.io/0xsero/deepseek-v4-flash-0731-spark-sparkinfer@sha256:2e077489a83a0360952828051fe7f7a32c1801e5ce8436d85f7267583d614ff4
    image: ds4-sparkinfer:spark-full
    build:
      context: ${HOME}/src/github.com/0xSero/deepseek-v4-flash-0731-spark-sparkinfer
      dockerfile: Dockerfile
    ipc: host
    shm_size: 16gb
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_REPO: 0xSero/deepseek-v4-flash-0731-spark
      MODEL_REVISION: 22f28d32b9b29b4352eaa380ff8c2c170b2847ab
      MAX_MODEL_LEN: "262144"
      MAX_NUM_SEQS: "4"
      MAX_NUM_BATCHED_TOKENS: "8224"
      MODE: dspark
      DSPARK_TOKENS: "5"
      DSPARK_CAPACITY: "0"
      DSPARK_DYNAMIC_DRAFT_DEPTH: "0"
      DSPARK_DYNAMIC_DRAFT_DEPTH_WINDOW: "8"
      DSPARK_DRAFT_EXPERTS: "64"
      DSPARK_STRUCTURED_EXPERTS_PER_CATEGORY: "32"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      GPU_MEMORY_UTILIZATION: "0.9465"
      VERIFY_MODEL_CHECKSUMS: "1"
    volumes:
      - ${HOME}/src/github.com/0xSero/deepseek-v4-flash-0731-spark-sparkinfer/data:/models
      - ${HOME}/src/github.com/0xSero/deepseek-v4-flash-0731-spark-sparkinfer/cache:/cache      
    networks:
      - spark-network
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "--connect-timeout 2" ,"--max-time 5", "http://localhost:8000/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  max-inference:
    image: modular/max-nvidia-full:latest
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:rw
      - ${HOME}/.cache/max_cache:/opt/venv/share/max/.max_cache:rw
    command:
      - --port
      - "8100"
      - --model
      - Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
      - --trust-remote-code
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - spark-network
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8100/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  sglang:
    image: lmsysorg/sglang:dev-cu13
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:30000/health" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s
    volumes:
      - ${HOME}/.cache/huggingface:/models/huggingface:ro
    shm_size: '32gb' 
    networks:
      - spark-network
    environment:
      - HF_HOME=/models/huggingface
      - HF_HUB_OFFLINE=1
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "127.0.0.1:30000:30000"
    command: >
      sglang serve
      --port 30000 
      --host 0.0.0.0
      --model-path ${SGLANG_MODEL:-Qwen/Qwen3.5-27B-FP8} 
      --context-length 261375
      --kv-cache-dtype fp8_e4m3 
      --tp 1 
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
  vllm:
    # image: vllm/vllm-openai:cu130-nightly-aarch64
    # image: ghcr.io/aeon-7/vllm-aeon-ultimate-dflash:qwen36-v3
    # look build-vllm-cuda13-docker.sh
    image: vllm:spark-full
    # build: 
    #  context: .
    #  dockerfile: Dockerfile.vllm.spark
    volumes:
      - ${HOME}/.cache/huggingface:/models/huggingface
      - vllm-cache:/root/.cache/
      - ./docker/vllm-configs:/etc/vllm-configs:ro
    #  - ./docker/chat-template-qwen3.jinja:/etc/vllm/chat-template.jinja:ro
    #  - ./docker/safetensors_coding_generation.json:/models/huggingface/hub/models--AxionML--Qwen3.5-35B-A3B-NVFP4/snapshots/75f5a9d934e5528d372916d8df7376ec52f6801a/generation_config.json:ro
    environment:
      - HF_HOME=/models/huggingface
      - HF_HUB_OFFLINE=1
      - HF_TOKEN=${HF_TOKEN:-}
      # ─── Core vLLM ───
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

      # ─── GB10 / sm_121a runtime ───
      - TORCH_CUDA_ARCH_LIST=12.1a
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_MATMUL_PRECISION=high
      - NVIDIA_FORWARD_COMPAT=1
      - NVIDIA_DISABLE_REQUIRE=1
      - CUTE_DSL_ARCH=sm_121a

      - ENABLE_NVFP4_SM120=1

      # ─── FP4 path selection ───
      - VLLM_USE_FLASHINFER_MOE_FP4=1
      - VLLM_TEST_FORCE_FP8_MARLIN=0
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
      # unified memory
      - VLLM_WORKER_MULTIPROC_METHOD=spawn  
      # VLLM_USE_DEEP_GEMM is env-only (no CLI flag, so it can't live in vllm-configs/*.yaml);
      # set VLLM_USE_DEEP_GEMM=0 in .env for FP8 models that crash with
      # deepgemm "Unknown SF transformation" (/vllm/.deps/deepgemm-src/csrc/apis/layout.hpp:60)
      - VLLM_USE_DEEP_GEMM=${VLLM_USE_DEEP_GEMM:-1}
      # flashinfer runtime compilation
      - MAX_JOBS=4
    ports:
      - "127.0.0.1:30001:30001"
    # vLLM start really slow =(
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:30001/health" ]
      interval: 30s
      timeout: 10s
      retries: 100
      start_period: 100s
    networks:
      - spark-network
    # per-model configs live in docker/vllm-configs/*.yaml, selected via VLLM_CONFIG in .env
    command: >
      vllm serve
      --config /etc/vllm-configs/${VLLM_CONFIG:-qwen3.6-35b-a3b-fp8.yaml}
      --host 0.0.0.0
      --port 30001
    # GB10: CUDA unified memory is host-backed and charged to this cgroup.
    # Without a limit a runaway load (e.g. runai_streamer staging 71GB+) eats all RAM + swap,
    # and the node OOM killer never fires because swap reclaim "makes progress" -> machine thrashes.
    # mem_limit + memswap_limit (equal) make the kernel OOM-kill only this container, early, no swap.
    mem_limit: 112g
    memswap_limit: 112g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  paroquant:
    # image: ghcr.io/z-lab/paroquant:serve
    image: paroquant:spark-full
    build:
      context: .
      dockerfile: Dockerfile.paroquant.spark
    ports:
      - "127.0.0.1:30002:30002"
    volumes:
      - ${HOME}/.cache/huggingface:/models/huggingface
    environment:
      - HF_HOME=/models/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_CACHE_ROOT=/models/huggingface
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    entrypoint:
      - /bin/bash
      - -xc
    command: >
      "
      python3 -m paroquant.cli.serve
      --model ${PAROQUANT_MODEL:-z-lab/Qwen3.6-27B-PARO}
      --host 0.0.0.0
      --port 30002
      --max-model-len 261375
      --max-num-batched-tokens 8192
      --enable-chunked-prefill
      --max-num-seqs 2
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.72
      --trust-remote-code
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --reasoning-parser gemma4
      "

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
  atlas:
    image: avarok/atlas-gb10:latest
    ipc: host
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - RUST_LOG=info
    command: >
      serve ${ATLAS_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      --bind 0.0.0.0
      --port 30003 
      --max-seq-len 261375 
      --max-batch-size 4
      --kv-cache-dtype ${ATLAS_KV_CACHE_TYPE:-fp8}
      --kv-high-precision-layers auto
      --gpu-memory-utilization ${ATLAS_MEMORY_USAGE:-0.9}
      --scheduling-policy slai
      --enable-prefix-caching
      --max-prefill-tokens 8192
      --speculative
      --num-drafts 2
      --tool-call-parser qwen3_coder
    ports:
      - "127.0.0.1:30003:30003"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - spark-network
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/30003; printf "GET /health HTTP/1.0\r\n\r\n" >&3; read -r _ code _ <&3; [ "$$code" = 200 ]']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  llama.cpp:
    build:
      context: .
      dockerfile: Dockerfile.llama.cpp.spark
    image: "llama.cpp:spark-full"
    # image: ghcr.io/ggml-org/llama.cpp:full-cuda13
    volumes:
      - ${HOME}/.cache/huggingface:/models/huggingface:ro
      - ./llama.cpp.models.ini:/etc/llama.cpp/config.ini
    entrypoint: /app/llama-server
    command:
      - --models-max
      - "1"
      - --models-preset
      - /etc/llama.cpp/config.ini
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - "--metrics"
    ports:
      - "127.0.0.1:8090:8090"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - spark-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  vibe-kanban:
    build:
      context: .
      dockerfile: Dockerfile.vibe-kanban
    image: vibe-kanban:spark
    volumes:
      - ${HOME}:/root/
      - /tmp:/tmp
    ports:
      - "127.0.0.1:${VIBE_KANBAN_PORT:-8888}:${VIBE_KANBAN_PORT:-8888}"
    networks:
      - spark-network
    environment:
      - HOME=/root
      - AGENT_INFERENCE_SERVER=${AGENT_INFERENCE_SERVER:-max-inference}
      - AGENT_MAIN_MODEL=${AGENT_MAIN_MODEL:-noctrex/MiniMax-M2-REAP-139B-A10B-MXFP4_MOE-GGUF}
      - AGENT_BACKGROUND_MODEL=${AGENT_BACKGROUND_MODEL:-noctrex/MiniMax-M2-REAP-139B-A10B-MXFP4_MOE-GGUF}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  seer-marketing:
    image: ghcr.io/mx-seer/seer:latest
    volumes:
      - ./docker/seer-config.yml:/app/config.yaml
    ports:
      - "127.0.0.1:${SEER_PORT:-8889}:${SEER_PORT:-8889}"
    networks:
      - spark-network
  
  aider-desk:
    image: ghcr.io/hotovo/aider-desk:latest
    ports:
    - "127.0.0.1:${AIDER_DESK_PORT:-24337}:${AIDER_DESK_PORT:-24337}"
    volumes:
    - aider-desk-data:/app/data/
    - ${HOME}/src/:/src/ 
    - ${HOME}/.aider-desk/:/root/.aider-desk/
    networks:
      - spark-network

  b4:
    image: lavrushin/b4:latest
    container_name: b4
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    volumes:
      - ./docker/b4:/etc/b4
    command: ["--config", "/etc/b4/b4.json"]
    restart: unless-stopped
# docker network create spark-network
networks:
  spark-network:
    external: true

volumes:
  aider-desk-data:
  vllm-cache: