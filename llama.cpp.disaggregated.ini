# dedicated ini for the disaggregated-llama.cpp service (compose mounts THIS file, not llama.cpp.models.ini)
# the fork-only key odp-blocks KILLS stock llama.cpp / prism-bonsai router at startup:
# server_models::load_models() re-parses the ini strictly (ignore_unknown_keys=false there),
# so the profile lives here - see the commented block in llama.cpp.models.ini for the full card notes
# card https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-NVFP4-prefiller (base Qwen/Qwen3.8-27B, arXiv:2609.26333)
# prefill: NVFP4 blocks streamed from SSD/page-cache into a 2-slot ring carved out of the output
#   head (zero device memory); decode: low-bit IQ2_S GGUF; needs Blackwell FP4 (GB10 sm_121)
# benchmark DGX Spark 2026-11-18: prefill 580-615 t/s @38-41k ctx, decode 18.2-18.3 t/s (no MTP),
#   ccr wallclock cold 3.3 / warm 4.6 t/s, 31 GiB unified, NVMe reads ~0 while page cache holds it

[ISTA-DASLab/Qwen3.8-27B-NVFP4-prefiller]
# odp-blocks points at the FIRST SPLIT of the IQ2_S set (64 shards, 13GB) - a FILE names the
#   variant exactly (all variants land flat in one snapshot dir, a dir would be ambiguous)
# ubatch-size MUST equal batch-size: ODP re-streams the whole checkpoint per ubatch (~64GiB of
#   block reads per 40k prompt), fork auto-raises ub only when it is not set explicitly
# cache-ram = 0 + ctx-checkpoints = 0 per card: server otherwise splits prompts for
#   recurrent-state snapshots, re-streaming the NVFP4 checkpoint; TRADE-OFF: prefix reuse
#   degrades to full re-prefill even on 96% LCP-similar prompts
model = /models/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4af51b3542f775b0a8e4b310bfb3f17e01c306c9/Qwen3.8-27B-UD-IQ2_S.gguf
mmproj = /models/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4af51b3542f775b0a8e4b310bfb3f17e01c306c9/mmproj-BF16.gguf
odp-blocks = /models/huggingface/hub/models--ISTA-DASLab--Qwen3.8-27B-NVFP4-prefiller/snapshots/b42f9b32657ff8221bbbd705d967a1cb7806bd12/Qwen3.8-27B-ODP-IQ2_S-00001-of-00064.gguf
jinja = true
ctx-size = 262144
temperature = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
image-min-tokens = 3072
reasoning-preserve = true
ctx-checkpoints = 0
cache-ram = 0
n-gpu-layers = 99
batch-size = 8192
ubatch-size = 8192
parallel = 2
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0
kv-unified = true
threads = 20
threads-batch = 20
